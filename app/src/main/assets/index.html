<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><title>Nico Scouter V0</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;min-height:100vh}header{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}.badge{font-size:12px;background:#202631;padding:6px 9px;border-radius:999px;color:#cfd8e6}main{padding:0 14px 18px}.search{display:grid;grid-template-columns:1fr 52px;gap:8px;margin:8px 0}input{width:100%;height:52px;border:1px solid #303746;border-radius:14px;background:#141821;color:#fff;padding:0 14px;font-size:16px;outline:none}button{border:0;border-radius:14px;background:#fff;color:#0b0d12;font-weight:800;font-size:15px;min-height:52px;padding:0 16px}button.secondary{background:#1b2130;color:#fff;border:1px solid #303746}.mic{font-size:23px;padding:0}.full{width:100%;margin-top:8px}.status{min-height:42px;padding:10px 4px;color:#c6ceda;font-size:14px}.status strong{color:#fff}.viewer{position:relative;width:100%;aspect-ratio:3/4;background:#111722;border-radius:18px;overflow:hidden;border:1px solid #252d3a}video,canvas.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas.overlay{pointer-events:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.result{margin-top:10px;background:#121722;border:1px solid #252d3a;border-radius:14px;padding:12px;min-height:48px}.found{font-weight:800}.hint{font-size:12px;color:#8f9bad;margin-top:8px;line-height:1.4}.pulse{animation:pulse .6s ease}@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,255,255,.2)}}</style></head><body><header><h1>🔎 Nico Scouter</h1><span class="badge">V0</span></header><main><div class="search"><input id="query" placeholder="cafetière, bananier, lampe globe…" autocomplete="off"/><button id="mic" class="mic secondary">🎙️</button></div><button id="go" class="full">CHERCHER</button><div id="status" class="status">Initialisation…</div><div class="viewer" id="viewer"><video id="video" playsinline autoplay muted></video><canvas id="overlay" class="overlay"></canvas></div><div class="controls"><button id="camera" class="secondary">📷 Caméra</button><button id="stop" class="secondary">⏹ Stop</button></div><div id="result" class="result">Aucun objet recherché.</div><div class="hint">Plusieurs objets possibles, séparés par une virgule.</div><canvas id="frame" hidden></canvas></main><script type="module">import{pipeline,RawImage,env}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm';env.allowLocalModels=false;env.useBrowserCache=true;const $=id=>document.getElementById(id),video=$('video'),overlay=$('overlay'),frame=$('frame'),query=$('query'),statusEl=$('status'),resultEl=$('result'),viewer=$('viewer');let detector=null,stream=null,running=false,detecting=false,labels=[],announced=new Map(),timer=null;function setStatus(t){statusEl.innerHTML=t}function normalizeVoice(t){return t.replace(/^\s*(cherche|trouve|trouver|je cherche|je veux trouver)\s+/i,'').trim()}window.setSearchTerm=t=>{query.value=normalizeVoice(t);startSearch()};async function ensureCamera(){if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();setStatus('📷 Caméra prête.')}catch(e){setStatus('❌ Autorise la caméra puis réessaie.');if(window.Android?.requestCamera)Android.requestCamera();throw e}}async function ensureModel(){if(detector)return;setStatus('🧠 <strong>Chargement de l’IA…</strong>');detector=await pipeline('zero-shot-object-detection','Xenova/owlvit-base-patch32',{dtype:'q8'});setStatus('✅ IA prête.')}function parseLabels(){return query.value.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).slice(0,10)}function fitCanvas(){const r=video.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);overlay.width=Math.round(r.width*dpr);overlay.height=Math.round(r.height*dpr);return{w:r.width,h:r.height,dpr}}function drawDetections(ds,imageW,imageH){const{w,h,dpr}=fitCanvas(),ctx=overlay.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const scale=Math.max(w/imageW,h/imageH),shownW=imageW*scale,shownH=imageH*scale,offX=(w-shownW)/2,offY=(h-shownH)/2;ctx.lineWidth=4;ctx.font='700 16px system-ui';for(const d of ds){const x=d.box.xmin*scale+offX,y=d.box.ymin*scale+offY,bw=(d.box.xmax-d.box.xmin)*scale,bh=(d.box.ymax-d.box.ymin)*scale;ctx.strokeStyle='#39ff88';ctx.fillStyle='rgba(0,0,0,.68)';ctx.strokeRect(x,y,bw,bh);const txt=`${d.label} ${Math.round(d.score*100)}%`,tw=ctx.measureText(txt).width+14,ty=Math.max(22,y);ctx.fillRect(x,ty-22,tw,24);ctx.fillStyle='#39ff88';ctx.fillText(txt,x+7,ty-5)}}function beep(){try{const ac=new(window.AudioContext||window.webkitAudioContext)(),osc=ac.createOscillator(),gain=ac.createGain();osc.frequency.value=880;gain.gain.value=.07;osc.connect(gain);gain.connect(ac.destination);osc.start();osc.stop(ac.currentTime+.12)}catch(_){}}function announce(d){const last=announced.get(d.label)||0,now=Date.now();if(now-last<3500)return;announced.set(d.label,now);beep();viewer.classList.remove('pulse');void viewer.offsetWidth;viewer.classList.add('pulse');if(window.Android?.speak)Android.speak(`${d.label} trouvé`)}async function detectOnce(){if(!running||detecting||!detector||!video.videoWidth)return;detecting=true;try{const maxW=480,scale=Math.min(1,maxW/video.videoWidth),w=Math.round(video.videoWidth*scale),h=Math.round(video.videoHeight*scale);frame.width=w;frame.height=h;frame.getContext('2d',{willReadFrequently:true}).drawImage(video,0,0,w,h);const image=RawImage.fromCanvas(frame),out=await detector(image,labels,{top_k:12,threshold:.08}),good=out.filter(x=>x.score>=.08);drawDetections(good,w,h);if(good.length){const best=good[0];resultEl.innerHTML=`<span class="found">🟩 ${best.label}</span> — ${Math.round(best.score*100)}%`;announce(best)}else resultEl.textContent=`🔍 Recherche : ${labels.join(' · ')}`}catch(e){console.error(e);setStatus('⚠️ Erreur IA : '+(e?.message||e))}finally{detecting=false}}function loop(){clearInterval(timer);timer=setInterval(detectOnce,1200);detectOnce()}async function startSearch(){labels=parseLabels();if(!labels.length){setStatus('Écris ou dis ce que tu cherches.');return}query.value=labels.join(', ');announced.clear();await ensureCamera();await ensureModel();running=true;setStatus(`🔎 Recherche active : <strong>${labels.join(' · ')}</strong>`);loop()}function stopSearch(){running=false;clearInterval(timer);timer=null;overlay.getContext('2d').clearRect(0,0,overlay.width,overlay.height);setStatus('⏹ Recherche arrêtée.')}$('go').addEventListener('click',startSearch);$('camera').addEventListener('click',ensureCamera);$('stop').addEventListener('click',stopSearch);$('mic').addEventListener('click',()=>{if(window.Android?.startVoice)Android.startVoice()});query.addEventListener('keydown',e=>{if(e.key==='Enter')startSearch()});window.addEventListener('resize',fitCanvas);ensureCamera().catch(()=>{});setStatus('📷 Autorise la caméra, puis écris ou dicte un objet.');</script></body></html>
