name: Nico OS padel repair once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nicoos-padel-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build one fresh encrypted padel repair command
        shell: bash
        run: |
          python -m pip install --quiet cryptography
          python - <<'PY'
          import base64, json
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import padding, rsa

          inbox_path = Path('nicoos_bridge/inbox.json')
          key_path = Path('nicoos_bridge/public_key.json')

          inbox = json.loads(inbox_path.read_text(encoding='utf-8'))
          key = json.loads(key_path.read_text(encoding='utf-8'))

          # Remove the superseded/broken padel repair attempts so they cannot keep retrying.
          bad_ids = {
              'chatgpt-20260916-padel-next-17',
              'chatgpt-20260916-padel-fix-stale-16',
              'chatgpt-20260917-padel-close-16-a',
              'chatgpt-20260917-padel-close-16-b',
              'chatgpt-20260917-padel-create-17',
          }
          inbox['commands'] = [c for c in inbox.get('commands', []) if c.get('id') not in bad_ids]

          payload = {
              'bridge_version': 2,
              'expires_at': '2026-09-24T22:00:00Z',
              'actions': [
                  {
                      'type': 'task_complete',
                      'project_name': 'Balles de padel pour SPA',
                      'selector': {'mode': 'current'}
                  },
                  {
                      'type': 'task_complete',
                      'project_name': 'Balles de padel pour SPA',
                      'selector': {'mode': 'current'}
                  },
                  {
                      'type': 'task_create',
                      'project_name': 'Balles de padel pour SPA',
                      'title': 'Appeler la mairie de Marle et organiser une nouvelle remise de balles dans le Laonnois',
                      'due': '2026-09-17',
                      'notes': "Une fois le lieu et la date confirmés, recontacter Camille Gantzer de L’Union pour le reportage."
                  }
              ]
          }

          raw = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          pub = rsa.RSAPublicNumbers(int(key['e']), int(key['n'])).public_key()
          max_chunk = int(key.get('chunk_plaintext_max', 160))
          chunks = []
          for i in range(0, len(raw), max_chunk):
              ct = pub.encrypt(
                  raw[i:i+max_chunk],
                  padding.OAEP(
                      mgf=padding.MGF1(algorithm=hashes.SHA256()),
                      algorithm=hashes.SHA256(),
                      label=None,
                  ),
              )
              chunks.append(base64.b64encode(ct).decode('ascii'))

          envelope = {
              'id': 'chatgpt-20260917-padel-fresh-repair-v2',
              'key_id': key['key_id'],
              'chunks': chunks,
          }
          inbox.setdefault('version', 2)
          inbox['commands'] = [c for c in inbox['commands'] if c.get('id') != envelope['id']]
          inbox['commands'].append(envelope)
          inbox_path.write_text(json.dumps(inbox, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('Fresh padel repair queued:', envelope['id'])
          PY

      - name: Commit repaired queue
        shell: bash
        run: |
          git config user.name 'nicoos-padel-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add nicoos_bridge/inbox.json
          if git diff --cached --quiet; then
            echo 'Nothing to change.'
            exit 0
          fi
          git commit -m 'Nico OS: fresh encrypted padel repair for 17 Sep'
          git push origin main
