name: Build Nico Scouter DIRECT Native V1

on:
  push:
    branches: [build-nico-scouter-v0]
    paths:
      - '.github/workflows/build-direct-native-v1.yml'
  workflow_dispatch:

jobs:
  build-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Recreate direct native Android project
        run: |
          cat > /tmp/native_project.b64 <<'B64'

B64
          rm -rf native_kotlin
          mkdir -p native_kotlin
          base64 -d /tmp/native_project.b64 > /tmp/native_project.zip
          unzip -q /tmp/native_project.zip -d native_kotlin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export and verify exact LiteRT model
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.4.120 litert-torch==0.9.3 ai-edge-litert==2.1.6
          python tests/test_yoloe_pf.py

      - name: Prepare native Android assets
        run: |
          mkdir -p native_kotlin/app/src/main/assets
          cp yoloe-26s-seg-pf_w8a32.tflite native_kotlin/app/src/main/assets/
          python - <<'PY'
          import base64, json, zipfile
          from pathlib import Path
          model=Path('yoloe-26s-seg-pf_w8a32.tflite')
          with zipfile.ZipFile(model) as z:
              meta=json.loads(z.read('metadata.json'))
          names=meta['names']
          labels=[names[str(i)] if str(i) in names else names[i] for i in range(len(names))]
          Path('native_kotlin/app/src/main/assets/labels.txt').write_text('\n'.join(labels), encoding='utf-8')
          Path('native_kotlin/app/src/main/assets/shoes_test.jpg').write_bytes(base64.b64decode(Path('tests/shoes_test_640.b64').read_text().strip()))
          print('labels', len(labels), 'model MB', round(model.stat().st_size/1024/1024, 2))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify no WorkManager or Flutter dependency
        working-directory: native_kotlin
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath > /tmp/deps.txt
          if grep -q 'androidx.work:work-runtime' /tmp/deps.txt; then grep 'androidx.work' /tmp/deps.txt; exit 1; fi
          if grep -qi 'flutter' /tmp/deps.txt; then exit 1; fi

      - name: Build direct Android APK
        working-directory: native_kotlin
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          cp native_kotlin/app/build/outputs/apk/debug/app-debug.apk NicoScouter-DIRECT-V1.apk
          ls -lh NicoScouter-DIRECT-V1.apk
          unzip -t NicoScouter-DIRECT-V1.apk >/dev/null
          if unzip -l NicoScouter-DIRECT-V1.apk | grep -qE 'lib/(x86|x86_64|armeabi-v7a)/'; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: NicoScouter-DIRECT-V1
          path: NicoScouter-DIRECT-V1.apk
          if-no-files-found: error
