name: Build Nico Scouter V0.8 Debug APK

on:
  push:
    branches: [build-nico-scouter-v0]
    paths:
      - 'native_src/**'
      - 'tests/test_yoloe_pf.py'
      - 'tests/shoes_test_640.b64'
      - '.github/workflows/build-native-scouter.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validated LiteRT export stack
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.4.120
          pip install litert-torch==0.9.3 ai-edge-litert==2.1.6

      - name: Export and verify mobile model
        run: |
          python tests/test_yoloe_pf.py
          test -f yoloe-26s-seg-pf_w8a32.tflite

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create clean Flutter Android project
        run: |
          rm -rf native_build
          flutter create --platforms=android --org fr.nico.clean --project-name nico_scouter_clean native_build
          cp native_src/pubspec.yaml native_build/pubspec.yaml
          cp native_src/main.dart native_build/lib/main.dart
          cp native_src/AndroidManifest.xml native_build/android/app/src/main/AndroidManifest.xml
          mkdir -p native_build/assets/models
          cp yoloe-26s-seg-pf_w8a32.tflite native_build/assets/models/yoloe-26s-seg-pf_w8a32.tflite
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' native_build/android/app/build.gradle.kts
          rm -rf native_build/test
          rm -f native_build/analysis_options.yaml

      - name: Resolve Flutter packages
        working-directory: native_build
        run: flutter pub get

      - name: Show WorkManager dependency
        working-directory: native_build/android
        run: |
          ./gradlew app:dependencies --configuration debugRuntimeClasspath > /tmp/deps.txt
          grep -E 'androidx\.work|androidx\.room|androidx\.startup' /tmp/deps.txt | head -80 || true

      - name: Analyze Dart
        working-directory: native_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build ARM64 debug APK without R8
        working-directory: native_build
        run: flutter build apk --debug --split-per-abi

      - name: Prepare and verify V0.8 APK
        run: |
          cp native_build/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk NicoScouter-V0.8-Debug-arm64.apk
          echo 'APK size:'
          ls -lh NicoScouter-V0.8-Debug-arm64.apk
          echo 'Check manifest merge removed WorkManagerInitializer:'
          grep -R "androidx.work.WorkManagerInitializer" native_build/build/intermediates/merged_manifests 2>/dev/null && exit 1 || true
          echo 'Native libraries:'
          unzip -l NicoScouter-V0.8-Debug-arm64.apk | grep ' lib/' | head -40
          if unzip -l NicoScouter-V0.8-Debug-arm64.apk | grep -qE 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-arm64 native library found'
            exit 1
          fi
          unzip -t NicoScouter-V0.8-Debug-arm64.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: NicoScouter-V0.8-Debug-arm64
          path: NicoScouter-V0.8-Debug-arm64.apk
          if-no-files-found: error
