name: Test Nico Scouter Detection

on:
  push:
    branches: [build-nico-scouter-v0]
    paths:
      - 'tests/**'
      - '.github/workflows/test-detection.yml'

jobs:
  test-yoloe-pf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YOLOE runtime
        run: |
          python -m pip install --upgrade pip
          pip install 'ultralytics>=8.4.83'
      - name: Test YOLOE prompt-free on exact user shoe image
        run: python tests/test_yoloe_pf.py
